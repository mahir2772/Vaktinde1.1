# Cloudflare Worker: Vaktinde Kur'an sesi ara sunucusu (kurulum: README.md)
name = "vaktinde-quran-audio"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
# QF onayından önce "prelive" (sadece Fâtiha ve Bakara), onaydan sonra "production"
QF_ENV = "prelive"
# "1" dışında bir değer: uygulama dinlemeyi "şu an kullanılamıyor" der
ENABLED = "1"

# IP başına dakikada en çok 60 istek (kötüye kullanıma karşı)
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
