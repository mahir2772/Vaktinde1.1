name: ezan_saati
description: "Vaktinde - Ezan vakitleri, kıble ve zikirmatik uygulaması."
publish_to: 'none'
version: 1.1.0+14

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
 
  flutter_localizations:
    sdk: flutter
  

  # Temel Paketler
  http: ^1.2.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  permission_handler: ^11.3.0
  intl: ^0.20.2
  provider: ^6.1.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^6.0.3
  in_app_review: ^2.0.9
  google_mobile_ads: ^5.1.0
  home_widget: ^0.7.0
  # Pusula İçin Sadece Bunlar Yeterli
  flutter_compass: ^0.8.0
  vector_math: ^2.1.4
  
  # Diğer Özellikler
  share_plus: ^10.0.0
  google_fonts: ^6.1.0
  url_launcher: ^6.2.0
  package_info_plus: ^9.0.1
  flutter_background_service: ^5.1.0
  firebase_core: ^4.3.0
  firebase_analytics: ^12.1.0
  firebase_crashlytics: ^5.2.7
  wakelock_plus: ^1.5.2
  in_app_update: ^4.2.5
  flutter_timezone: ^5.1.0
  workmanager: ^0.9.0+3
  hijri: ^3.0.1
  adhan_dart: ^2.0.1
  showcaseview: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  
  
  generate: true
  

  assets:
    - assets/sounds/
    - assets/icon/
    - assets/data/
    - assets/images/backgrounds/
    - assets/google_fonts/
    - assets/fonts/amiri/

  # Uygulama yazı tipi (tema: lib/core/ui/app_theme.dart) ve Arapça metinler için Amiri
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/google_fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/google_fonts/Poppins-Black.ttf
          weight: 900
    - family: Amiri
      fonts:
        - asset: assets/fonts/amiri/Amiri-Regular.ttf


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 

flutter_native_splash:
  color: "#009688"
  image: assets/icon/icon.png
  android_12:
    image: assets/icon/icon.png
    color: "#009688"